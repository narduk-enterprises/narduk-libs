name: Release packages

on:
  workflow_dispatch:
    inputs:
      verified-sha:
        description: Exact CI-verified commit retained in main history
        required: true
        type: string
  # Only main-branch CI runs can release. Without this filter every
  # pull_request CI completion queued a Release run that the job-level `if:`
  # then skipped, and those skipped runs read as failed publishes. The
  # job-level `if:` below stays as defense in depth (a PR head branch can
  # itself be named `main`).
  #
  # `requested` exists for one commit shape only (narduk-libs#1354): the
  # release PR's merge. Its own full CI run already tested the identical tree,
  # so `verify-ci` proves it by the tree rule the moment the push CI is
  # requested, and publishing no longer waits for a second full run of the same
  # suite. For every other main push the `requested` run's jobs are skipped (see
  # the concurrency group), and `completed` is unchanged.
  workflow_run:
    workflows:
      - CI
    types:
      - requested
      - completed
    branches:
      - main

# A `requested` run for anything but the release PR's merge on main (the same
# three conditions as verify-ci's `if:`) gets a group of its own. Workflow-level concurrency is evaluated before job `if:`, so a skipped
# run in the shared group would replace a real queued Release run (the #477
# lesson that recheck-main also follows).
concurrency:
  group: >-
    ${{ (github.event.action == 'requested' && !(github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && startsWith(github.event.workflow_run.head_commit.message, 'chore: release packages')) && format('narduk-libs-release-skipped-{0}', github.run_id)) || 'narduk-libs-release' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-ci:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.action == 'completed' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main') ||
      (github.event.action == 'requested' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'chore: release packages'))
    # Verify the exact main commit before the publishing job runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      verified: ${{ steps.verify.outputs.verified }}
    env:
      VERIFIED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.verified-sha || github.event.workflow_run.head_sha }}
      # `early`: the push CI is only requested, so only the tree rule can
      # answer, and "cannot" ends this run quietly instead of failing it.
      RELEASE_VERIFY_MODE: ${{ github.event.action == 'requested' && 'early' || 'standard' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify successful full CI for this exact main commit (push run, or the release PR's tree-identical run)
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-release-ci.mjs
          echo "sha=${VERIFIED_SHA}" >> "$GITHUB_OUTPUT"

  # No `environment:` here, on purpose. The npm-release environment holds the
  # estate App key (LANE_AUTOMATION_APP_KEY). GitHub makes environment secrets
  # available only to jobs that use the environment, and it scrubs only the
  # secrets a workflow never names; this workflow names the key in
  # notify-mirror. So a job that runs `pnpm install` and changesets/action must
  # stay out of npm-release, or the key could share a runner with dependency
  # scripts. That environment's main-only branch policy protected nothing else:
  # publishing uses the job-scoped GITHUB_TOKEN below, and verify-ci has already
  # pinned the run to a CI-verified commit on main.
  release:
    needs: verify-ci
    # An early run that could not prove the commit by the tree rule ends here;
    # the run main's push CI completion starts proves and publishes it.
    if: needs.verify-ci.outputs.verified == 'true'
    permissions:
      contents: write
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      published: ${{ steps.publish-first.outputs.published == 'true' || steps.changesets.outputs.published == 'true' }}
      current: ${{ steps.main-state.outputs.current }}
      release-pr-head: ${{ steps.release-pr.outputs.head }}
      release-pr-number: ${{ steps.release-pr.outputs.number }}
    env:
      VERIFIED_SHA: ${{ needs.verify-ci.outputs.sha }}
      NODE_OPTIONS: --max-old-space-size=3072
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
    steps:
      - name: Check out verified main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact verified SHA retained in main
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VERIFIED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git rev-parse --verify "refs/remotes/origin/main^{commit}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
          git merge-base --is-ancestor "${VERIFIED_SHA}" origin/main
          # Changesets resolves its base against a local ref after this detached checkout.
          git branch --force main "${VERIFIED_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the job token can read every existing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-package-actions-access.mjs

      # Publishing with GITHUB_TOKEN requires this repository's Actions access
      # to each existing GitHub Package. Verify the grants before publication.
      - name: Configure GitHub Packages write auth
        env:
          PACKAGE_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PACKAGE_WRITE_TOKEN:-}"
          umask 077
          cat > "${NPM_CONFIG_USERCONFIG}" <<EOF
          @narduk-enterprises:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${PACKAGE_WRITE_TOKEN}
          EOF

      - name: Detect whether the verified commit is current main
        id: main-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if test "${current_main}" = "${VERIFIED_SHA}"; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi

      # A runtime dependency bump reaches main without a Changeset on purpose
      # (scripts/release-plan-guard.mjs, verdict `deferred`), so the published
      # manifest is the only record that a patch release is owed. Synthesize
      # those Changesets here, before the mode is selected, so they take the
      # Changesets action's version path and appear in the release PR. The
      # script writes nothing while any version is still waiting to publish,
      # and fails the job on any registry read it cannot resolve.
      #
      # This is the only automatic trigger for that comparison, and it needs a
      # push to main to fire. When a release run is lost -- red CI on the push,
      # or the concurrency group cancelling a queued run -- re-run this workflow
      # by hand with `verified-sha` set to current main; that is what puts
      # `main-state.current` back to `true`. See docs/package-releases.md,
      # "When a Changeset is required".
      #
      # Not in an early run (a `requested` CI event, narduk-libs#1354): that run
      # publishes the release merge and nothing else. Release-PR preparation
      # belongs to the run the push CI's completion starts, so a release merge
      # never force-pushes changeset-release/main twice (two heads, two CI runs,
      # two approvals).
      - name: Synthesize patch changesets for published manifest drift
        if: steps.main-state.outputs.current == 'true' && github.event.action != 'requested'
        run: pnpm run release:synthesize-drift

      - name: Select publication or current-main version preparation
        id: release-mode
        shell: bash
        run: |
          set -euo pipefail
          echo "current=${{ steps.main-state.outputs.current }}" >> "$GITHUB_OUTPUT"
          node --input-type=module -e "import { readdirSync, appendFileSync } from 'node:fs'; const pending = readdirSync('.changeset').some(name => name.endsWith('.md') && name !== 'README.md'); appendFileSync(process.env.GITHUB_OUTPUT, 'publish=' + !pending + '\\n')"

      # changesets/action v1.9.0 writes a .netrc for its git-cli push. Keep
      # that credential outside the checkout and only after untrusted install.
      - name: Prepare isolated Changesets home
        run: |
          mkdir -p "${RUNNER_TEMP}/changesets-home"
          install -m 0600 /dev/null "${RUNNER_TEMP}/changesets-home/.netrc"

      # narduk-libs#1102. A release-PR merge commit can also carry Changesets
      # from PRs that merged after the release PR last refreshed. The Changesets
      # action publishes only when no Changeset is pending, so that commit used
      # to publish nothing while this run stayed green. Set the pending
      # Changesets aside, let the action publish the versions main already
      # bumped (tags and GitHub releases included), then restore them for the
      # version step below. With every version already on the registry,
      # release:publish publishes nothing and this costs one registry read per
      # package.
      - name: Set aside pending changesets to publish main's bumped versions first
        id: set-aside
        if: steps.release-mode.outputs.publish == 'false'
        run: node scripts/pending-changesets.mjs set-aside "${RUNNER_TEMP}/pending-changesets"

      - name: Publish versions main already bumped
        id: publish-first
        if: steps.set-aside.outcome == 'success'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm run release:publish
        env:
          HOME: ${{ runner.temp }}/changesets-home
          GITHUB_TOKEN: ${{ github.token }}

      # Before the version step: in version mode the action leaves the working
      # tree on the release branch, whose manifests are not published yet.
      - name: Verify the versions published first
        if: steps.publish-first.outcome == 'success'
        run: pnpm run release:verify-published

      - name: Restore pending changesets
        if: always() && steps.set-aside.outcome == 'success'
        run: node scripts/pending-changesets.mjs restore "${RUNNER_TEMP}/pending-changesets"

      - name: Prepare or publish the independently verified package versions
        id: changesets
        # An early run takes this step only to publish (nothing pending); the
        # version path, which pushes the release PR, is the completed run's.
        if: steps.release-mode.outputs.publish == 'true' || (steps.release-mode.outputs.current == 'true' && github.event.action != 'requested')
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run release:version
          publish: pnpm run release:publish
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          HOME: ${{ runner.temp }}/changesets-home
          GITHUB_TOKEN: ${{ github.token }}

      # The commit this run just pushed to the release PR's branch, for the
      # approve-release-pr-ci jobs below. Read from this checkout, never from the
      # API, so "pushed by this run" is a fact of the run. The action leaves the
      # working tree on the release branch in version mode.
      - name: Record the release PR head this run pushed
        id: release-pr
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        shell: bash
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          branch="$(git rev-parse --abbrev-ref HEAD)"
          if [[ "${head}" =~ ^[0-9a-f]{40}$ && "${PR_NUMBER}" =~ ^[0-9]+$ && "${branch}" == 'changeset-release/main' ]]; then
            echo "head=${head}" >> "$GITHUB_OUTPUT"
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Release PR CI left to manual approval::the checkout is on '${branch}' at '${head}', not the release branch, so no head was recorded for approval."
          fi

      - name: Verify immutable published package versions
        if: steps.release-mode.outputs.publish == 'true'
        run: pnpm run release:verify-published

      - name: Remove temporary registry auth
        if: always()
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG}"
          rm -f "${RUNNER_TEMP}/changesets-home/.netrc"

  # narduk-libs#1119. A run whose verified commit is no longer main's tip
  # publishes what that commit bumped, but skips drift synthesis and
  # release-PR preparation. It used to end green and silent. This job reads
  # main's tip and either leaves the work to a queued Release run or to the
  # tip's CI, dispatches release.yml for a green tip, or warns with the
  # command when the tip's CI is red. It never dispatches into a busy
  # narduk-libs-release group (see scripts/recheck-release-main.mjs). It
  # installs nothing, so actions: write never shares a job with dependency
  # scripts.
  recheck-main:
    needs: [verify-ci, release]
    if: needs.release.outputs.current != 'true'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Hand the release on to main's newest commit, or say why not
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ needs.verify-ci.outputs.sha }}
        run: node scripts/recheck-release-main.mjs

  # narduk-libs#1354, cut 1. The "chore: release packages" PR is pushed with
  # the job-scoped GITHUB_TOKEN above, so GitHub holds its pull_request CI run
  # as `action_required` until someone approves it (median 574 s on 2026-10-02).
  # Two jobs start it, split so the estate App key never shares a job with
  # checked-out code:
  #
  #   plan-release-pr-approval  holds no secret. It checks out main for
  #                             scripts/approve-release-pr-ci.mjs and, with the
  #                             read-only job token, decides which held run
  #                             may be approved (see the script for the guard).
  #   approve-release-pr-ci     holds the App key (environment npm-release),
  #                             checks out nothing and runs no script from this
  #                             repository: it mints, verifies the scope and
  #                             approves only the run ids the plan job emitted.
  #
  # Approving the held run is the path docs/package-releases.md already
  # documents. Dispatching ci.yml on changeset-release/main is not: its checks
  # never counted toward the PR's required checks (#837, #861, #865). Do not
  # reintroduce it. #198 tracks authoring the PR with an App token instead,
  # which would need the key beside `pnpm install`; that stays out.
  plan-release-pr-approval:
    needs: [release]
    if: needs.release.outputs.release-pr-head != ''
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
      head: ${{ steps.plan.outputs.head }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Decide which held run for this run's release PR head may be approved
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ needs.release.outputs.release-pr-head }}
          PR_NUMBER: ${{ needs.release.outputs.release-pr-number }}
        run: node scripts/approve-release-pr-ci.mjs

  # npm.nard.uk mirrors GitHub Packages through package-delivery's "Sync to R2"
  # workflow. Its schedule is the correctness mechanism; this dispatch only
  # shortens the delay between a publish and the mirror serving it
  # (agent-infrastructure docs/npm-registry-delivery.md, "optional dispatch,
  # for immediacy"). GitHub fires that schedule irregularly -- on 2026-09-18
  # versions published at 16:05Z waited for a manual dispatch at 16:14Z
  # (package-delivery#4). A missed dispatch costs one sweep interval, never a
  # version, so this job can never fail the release.
  #
  # CREDENTIAL. `POST /repos/{owner}/{repo}/dispatches` needs `contents: write`
  # on package-delivery, which this repository's GITHUB_TOKEN cannot carry.
  # The job mints a per-run token from the estate write ceiling,
  # `narduk-lane-automation` (agent-infrastructure docs/standards/GITHUB-APPS.md, D-GHAPP-1),
  # downscoped to exactly package-delivery and `contents: write`, and reads it
  # back before use -- the same shape as company-hq's
  # operator-portal-read-model-dispatch.yml. Until LANE_AUTOMATION_APP_KEY
  # (environment npm-release, gated to main) and LANE_AUTOMATION_CLIENT_ID
  # (repository variable) are delivered, the job records a notice and
  # dispatches nothing. It checks out no code and installs nothing, so the key
  # never shares a job with dependency install scripts. It is the only job in
  # this workflow that uses npm-release.
  notify-mirror:
    needs: [verify-ci, release]
    if: needs.release.outputs.published == 'true'
    environment: npm-release
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check for the mirror dispatch credential
        id: credential
        env:
          LANE_AUTOMATION_APP_KEY: ${{ secrets.LANE_AUTOMATION_APP_KEY }}
          LANE_AUTOMATION_CLIENT_ID: ${{ vars.LANE_AUTOMATION_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${LANE_AUTOMATION_APP_KEY:-}" ] && [ -n "${LANE_AUTOMATION_CLIENT_ID:-}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Mirror dispatch skipped::LANE_AUTOMATION_APP_KEY (environment npm-release) or LANE_AUTOMATION_CLIENT_ID (repository variable) is absent, so package-delivery was not notified. npm.nard.uk picks up this release on its next scheduled sync."
          fi

      - name: Mint a dispatch token scoped to package-delivery
        id: mint
        if: steps.credential.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LANE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.LANE_AUTOMATION_APP_KEY }}
          owner: narduk-enterprises
          repositories: package-delivery
          permission-contents: write

      - name: Verify the token sees exactly package-delivery
        if: steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          seen="$(gh api /installation/repositories --paginate --jq '.repositories[].full_name' | sort | tr '\n' ' ')"
          if [ "${seen}" != "narduk-enterprises/package-delivery " ]; then
            echo "::error title=Unscoped mint::the minted token sees [${seen}] rather than exactly narduk-enterprises/package-delivery; refusing to dispatch with it."
            exit 1
          fi

      - name: Dispatch the npm.nard.uk mirror sync
        if: steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          VERIFIED_SHA: ${{ needs.verify-ci.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Provenance only: the sync reads GitHub Packages, never this payload.
          gh api repos/narduk-enterprises/package-delivery/dispatches \
            --method POST \
            -f event_type=narduk-libs-release \
            -f "client_payload[sha]=${VERIFIED_SHA}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}"
          echo "dispatched narduk-libs-release to narduk-enterprises/package-delivery"

      - name: Report a failed mirror dispatch without failing the release
        if: failure()
        run: echo "::warning title=Mirror dispatch failed::package-delivery was not notified; npm.nard.uk picks up this release on its next scheduled sync. The packages themselves published and verified."

  # Credential shape is notify-mirror's: a per-run token from the estate write
  # ceiling `narduk-lane-automation` (agent-infrastructure
  # docs/standards/GITHUB-APPS.md, D-GHAPP-1; its installation on
  # narduk-enterprises already carries `actions: write`, so nothing is widened),
  # downscoped to exactly this repository and `actions: write`, and read back
  # before use (the repository list is the only part of a minted token that the
  # token itself can report; its permissions cannot be read back, so
  # `permission-actions: write` rests on the mint request, which GitHub refuses
  # if the installation lacks it -- the same accepted check notify-mirror has,
  # recorded in docs/package-releases.md). The only call it makes is the approve
  # call the hand procedure in
  # docs/package-releases.md makes, for run ids the plan job validated. With the
  # key or the variable absent it records a notice and the manual approval still
  # works. It can never fail a release.
  approve-release-pr-ci:
    needs: [release, plan-release-pr-approval]
    if: needs.plan-release-pr-approval.outputs.runs != ''
    environment: npm-release
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check for the approval credential
        id: credential
        env:
          LANE_AUTOMATION_APP_KEY: ${{ secrets.LANE_AUTOMATION_APP_KEY }}
          LANE_AUTOMATION_CLIENT_ID: ${{ vars.LANE_AUTOMATION_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${LANE_AUTOMATION_APP_KEY:-}" ] && [ -n "${LANE_AUTOMATION_CLIENT_ID:-}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Release PR CI left to manual approval::LANE_AUTOMATION_APP_KEY (environment npm-release) or LANE_AUTOMATION_CLIENT_ID (repository variable) is absent, so the held CI run was not approved. Approve it as docs/package-releases.md describes."
          fi

      - name: Mint an approval token scoped to this repository
        id: mint
        if: steps.credential.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LANE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.LANE_AUTOMATION_APP_KEY }}
          owner: narduk-enterprises
          repositories: narduk-libs
          permission-actions: write

      - name: Verify the token sees exactly narduk-libs
        if: steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          seen="$(gh api /installation/repositories --paginate --jq '.repositories[].full_name' | sort | tr '\n' ' ')"
          if [ "${seen}" != "narduk-enterprises/narduk-libs " ]; then
            echo "::error title=Unscoped mint::the minted token sees [${seen}] rather than exactly narduk-enterprises/narduk-libs; refusing to approve with it."
            exit 1
          fi

      # Two re-reads through the scoped token, each of which skips the run (a
      # warning, then `continue`, before the POST) rather than approving it:
      # the run must still be the held ci.yml pull_request run for exactly the
      # planned head, and the pull request must still be open at that head. A
      # head that moved since the plan job read it is superseded, and approving
      # its held run would take the PR's concurrency group and cancel the
      # current head's run (2026-09-22). scripts/approve-release-pr-ci.test.mjs
      # runs this script against a stub `gh` and fails if either skip is lost.
      - name: Approve the held CI run for the release PR head
        if: steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          RUN_IDS: ${{ needs.plan-release-pr-approval.outputs.runs }}
          RELEASE_PR_HEAD: ${{ needs.plan-release-pr-approval.outputs.head }}
          RELEASE_PR_NUMBER: ${{ needs.plan-release-pr-approval.outputs.pr }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_PR_HEAD}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_PR_NUMBER}" =~ ^[0-9]+$ ]]
          for id in ${RUN_IDS}; do
            [[ "${id}" =~ ^[0-9]+$ ]]
            # Re-read the run through the scoped token: it must still be the
            # held ci.yml pull_request run for exactly the planned head.
            held="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq '[.head_sha, .head_branch, .event, .conclusion, .head_repository.full_name] | join(" ")')"
            if [ "${held}" != "${RELEASE_PR_HEAD} changeset-release/main pull_request action_required ${GITHUB_REPOSITORY}" ]; then
              echo "::warning title=Release PR CI left to manual approval::run ${id} is no longer the held run for ${RELEASE_PR_HEAD} (${held}); approving nothing for it."
              continue
            fi
            # Re-read the pull request: its head must still be the planned one.
            current="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${RELEASE_PR_NUMBER}" --jq '[.state, .head.sha, .head.ref] | join(" ")')"
            if [ "${current}" != "open ${RELEASE_PR_HEAD} changeset-release/main" ]; then
              echo "::warning title=Release PR CI left to manual approval::pull request #${RELEASE_PR_NUMBER} is no longer open at ${RELEASE_PR_HEAD} (${current}); a newer head's run approves its own, and run ${id} is left alone."
              continue
            fi
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve"
            echo "::notice title=Release PR CI started::approved held ci.yml run ${id} for release PR head ${RELEASE_PR_HEAD}."
          done

      - name: Report a failed approval without failing the release
        if: failure()
        run: echo "::warning title=Release PR CI approval failed::the held run was not approved. The release is unaffected; approve it as docs/package-releases.md describes."
