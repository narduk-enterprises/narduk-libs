name: Release packages

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

concurrency:
  group: narduk-libs-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [self-hosted, Linux, X64, proxmox]
    timeout-minutes: 45
    env:
      VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
      NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || secrets.NARDUK_PLATFORM_GH_PACKAGES_RW }}
      NARDUK_PLATFORM_GH_PACKAGES_WRITE: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_WRITE || secrets.NARDUK_PLATFORM_GH_PACKAGES_RW }}
      NODE_OPTIONS: --max-old-space-size=3072
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
    steps:
      - name: Check out verified main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Require the exact successful CI SHA
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
          test "$(git rev-parse origin/main)" = "${VERIFIED_SHA}"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Configure GitHub Packages read auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NARDUK_PLATFORM_GH_PACKAGES_READ:-}"
          umask 077
          cat > "${NPM_CONFIG_USERCONFIG}" <<EOF
          @narduk-enterprises:registry=https://npm.pkg.github.com
          @narduk-geo:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NARDUK_PLATFORM_GH_PACKAGES_READ}
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure GitHub Packages write auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NARDUK_PLATFORM_GH_PACKAGES_WRITE:-}"
          umask 077
          cat > "${NPM_CONFIG_USERCONFIG}" <<EOF
          @narduk-enterprises:registry=https://npm.pkg.github.com
          @narduk-geo:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NARDUK_PLATFORM_GH_PACKAGES_WRITE}
          EOF

      - name: Prepare or publish independently verified package versions
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run release:version
          publish: pnpm run release:publish
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify immutable published package versions
        if: steps.changesets.outputs.published == 'true'
        run: pnpm run release:verify-published

      - name: Remove temporary registry auth
        if: always()
        run: rm -f "${NPM_CONFIG_USERCONFIG}"
