name: Release packages

on:
  workflow_dispatch:
    inputs:
      verified-sha:
        description: Exact CI-verified commit retained in main history
        required: true
        type: string
  # Only main-branch CI completions can release. Without this filter every
  # pull_request CI completion queued a Release run that the job-level `if:`
  # then skipped, and those skipped runs read as failed publishes. The
  # job-level `if:` below stays as defense in depth (a PR head branch can
  # itself be named `main`).
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: narduk-libs-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-ci:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    # Verify the exact main commit before the publishing job runs.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    env:
      VERIFIED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.verified-sha || github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify successful full CI for this exact main commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-release-ci.mjs
          echo "sha=${VERIFIED_SHA}" >> "$GITHUB_OUTPUT"

  # No `environment:` here, on purpose. The npm-release environment holds the
  # estate App key (LANE_AUTOMATION_APP_KEY). GitHub makes environment secrets
  # available only to jobs that use the environment, and it scrubs only the
  # secrets a workflow never names; this workflow names the key in
  # notify-mirror. So a job that runs `pnpm install` and changesets/action must
  # stay out of npm-release, or the key could share a runner with dependency
  # scripts. That environment's main-only branch policy protected nothing else:
  # publishing uses the job-scoped GITHUB_TOKEN below, and verify-ci has already
  # pinned the run to a CI-verified commit on main.
  release:
    needs: verify-ci
    permissions:
      contents: write
      packages: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    env:
      VERIFIED_SHA: ${{ needs.verify-ci.outputs.sha }}
      NODE_OPTIONS: --max-old-space-size=3072
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
    steps:
      - name: Check out verified main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the exact verified SHA retained in main
        shell: bash
        run: |
          set -euo pipefail
          [[ "${VERIFIED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git rev-parse --verify "refs/remotes/origin/main^{commit}"
          test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
          git merge-base --is-ancestor "${VERIFIED_SHA}" origin/main
          # Changesets resolves its base against a local ref after this detached checkout.
          git branch --force main "${VERIFIED_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the job token can read every existing package
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-package-actions-access.mjs

      # Publishing with GITHUB_TOKEN requires this repository's Actions access
      # to each existing GitHub Package. Verify the grants before publication.
      - name: Configure GitHub Packages write auth
        env:
          PACKAGE_WRITE_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PACKAGE_WRITE_TOKEN:-}"
          umask 077
          cat > "${NPM_CONFIG_USERCONFIG}" <<EOF
          @narduk-enterprises:registry=https://npm.pkg.github.com
          @narduk-geo:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${PACKAGE_WRITE_TOKEN}
          EOF

      - name: Detect whether the verified commit is current main
        id: main-state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_main=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          if test "${current_main}" = "${VERIFIED_SHA}"; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi

      # A runtime dependency bump reaches main without a Changeset on purpose
      # (scripts/release-plan-guard.mjs, verdict `deferred`), so the published
      # manifest is the only record that a patch release is owed. Synthesize
      # those Changesets here, before the mode is selected, so they take the
      # Changesets action's version path and appear in the release PR. The
      # script writes nothing while any version is still waiting to publish,
      # and fails the job on any registry read it cannot resolve.
      #
      # This is the only automatic trigger for that comparison, and it needs a
      # push to main to fire. When a release run is lost -- red CI on the push,
      # or the concurrency group cancelling a queued run -- re-run this workflow
      # by hand with `verified-sha` set to current main; that is what puts
      # `main-state.current` back to `true`. See docs/package-releases.md,
      # "When a Changeset is required".
      - name: Synthesize patch changesets for published manifest drift
        if: steps.main-state.outputs.current == 'true'
        run: pnpm run release:synthesize-drift

      - name: Select publication or current-main version preparation
        id: release-mode
        shell: bash
        run: |
          set -euo pipefail
          echo "current=${{ steps.main-state.outputs.current }}" >> "$GITHUB_OUTPUT"
          node --input-type=module -e "import { readdirSync, appendFileSync } from 'node:fs'; const pending = readdirSync('.changeset').some(name => name.endsWith('.md') && name !== 'README.md'); appendFileSync(process.env.GITHUB_OUTPUT, 'publish=' + !pending + '\\n')"

      # changesets/action v1.9.0 writes a .netrc for its git-cli push. Keep
      # that credential outside the checkout and only after untrusted install.
      - name: Prepare isolated Changesets home
        if: steps.release-mode.outputs.publish == 'true' || steps.release-mode.outputs.current == 'true'
        run: |
          mkdir -p "${RUNNER_TEMP}/changesets-home"
          install -m 0600 /dev/null "${RUNNER_TEMP}/changesets-home/.netrc"

      - name: Prepare or publish the independently verified package versions
        id: changesets
        if: steps.release-mode.outputs.publish == 'true' || steps.release-mode.outputs.current == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm run release:version
          publish: pnpm run release:publish
          title: "chore: release packages"
          commit: "chore: release packages"
        env:
          HOME: ${{ runner.temp }}/changesets-home
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify immutable published package versions
        if: steps.release-mode.outputs.publish == 'true'
        run: pnpm run release:verify-published

      - name: Remove temporary registry auth
        if: always()
        run: |
          rm -f "${NPM_CONFIG_USERCONFIG}"
          rm -f "${RUNNER_TEMP}/changesets-home/.netrc"

  # No job here starts CI for the "chore: release packages" PR. That PR is
  # pushed with the job-scoped GITHUB_TOKEN above, so GitHub holds its
  # pull_request CI run as `action_required` until someone approves it. A
  # `release-pr-ci` job used to dispatch ci.yml on changeset-release/main
  # instead (#837). Its `ci / Required` and `verify` check runs landed on the
  # head commit but never counted toward the PR's required checks: on #805,
  # two heads stayed `required=0/2` until the held run was approved (#861,
  # #865). It only doubled CI. Approving the held run for the current head is
  # the path: docs/package-releases.md, "Approving `chore: release packages`
  # PR runs". #198 tracks authoring the PR with an App token instead.

  # npm.nard.uk mirrors GitHub Packages through package-delivery's "Sync to R2"
  # workflow. Its schedule is the correctness mechanism; this dispatch only
  # shortens the delay between a publish and the mirror serving it
  # (agent-infrastructure docs/npm-registry-delivery.md, "optional dispatch,
  # for immediacy"). GitHub fires that schedule irregularly -- on 2026-09-18
  # versions published at 16:05Z waited for a manual dispatch at 16:14Z
  # (package-delivery#4). A missed dispatch costs one sweep interval, never a
  # version, so this job can never fail the release.
  #
  # CREDENTIAL. `POST /repos/{owner}/{repo}/dispatches` needs `contents: write`
  # on package-delivery, which this repository's GITHUB_TOKEN cannot carry.
  # The job mints a per-run token from the estate write ceiling,
  # `narduk-lane-automation` (company-hq docs/GITHUB-APPS.md, D-GHAPP-1),
  # downscoped to exactly package-delivery and `contents: write`, and reads it
  # back before use -- the same shape as company-hq's
  # operator-portal-read-model-dispatch.yml. Until LANE_AUTOMATION_APP_KEY
  # (environment npm-release, gated to main) and LANE_AUTOMATION_CLIENT_ID
  # (repository variable) are delivered, the job records a notice and
  # dispatches nothing. It checks out no code and installs nothing, so the key
  # never shares a job with dependency install scripts. It is the only job in
  # this workflow that uses npm-release.
  notify-mirror:
    needs: [verify-ci, release]
    if: needs.release.outputs.published == 'true'
    environment: npm-release
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Check for the mirror dispatch credential
        id: credential
        env:
          LANE_AUTOMATION_APP_KEY: ${{ secrets.LANE_AUTOMATION_APP_KEY }}
          LANE_AUTOMATION_CLIENT_ID: ${{ vars.LANE_AUTOMATION_CLIENT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${LANE_AUTOMATION_APP_KEY:-}" ] && [ -n "${LANE_AUTOMATION_CLIENT_ID:-}" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Mirror dispatch skipped::LANE_AUTOMATION_APP_KEY (environment npm-release) or LANE_AUTOMATION_CLIENT_ID (repository variable) is absent, so package-delivery was not notified. npm.nard.uk picks up this release on its next scheduled sync."
          fi

      - name: Mint a dispatch token scoped to package-delivery
        id: mint
        if: steps.credential.outputs.present == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.LANE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.LANE_AUTOMATION_APP_KEY }}
          owner: narduk-enterprises
          repositories: package-delivery
          permission-contents: write

      - name: Verify the token sees exactly package-delivery
        if: steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          seen="$(gh api /installation/repositories --paginate --jq '.repositories[].full_name' | sort | tr '\n' ' ')"
          if [ "${seen}" != "narduk-enterprises/package-delivery " ]; then
            echo "::error title=Unscoped mint::the minted token sees [${seen}] rather than exactly narduk-enterprises/package-delivery; refusing to dispatch with it."
            exit 1
          fi

      - name: Dispatch the npm.nard.uk mirror sync
        if: steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
          VERIFIED_SHA: ${{ needs.verify-ci.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Provenance only: the sync reads GitHub Packages, never this payload.
          gh api repos/narduk-enterprises/package-delivery/dispatches \
            --method POST \
            -f event_type=narduk-libs-release \
            -f "client_payload[sha]=${VERIFIED_SHA}" \
            -f "client_payload[run_id]=${GITHUB_RUN_ID}"
          echo "dispatched narduk-libs-release to narduk-enterprises/package-delivery"

      - name: Report a failed mirror dispatch without failing the release
        if: failure()
        run: echo "::warning title=Mirror dispatch failed::package-delivery was not notified; npm.nard.uk picks up this release on its next scheduled sync. The packages themselves published and verified."
