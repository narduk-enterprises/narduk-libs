name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: narduk-libs-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: [self-hosted, Linux, X64, proxmox]
    timeout-minutes: 45
    env:
      NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || secrets.NARDUK_PLATFORM_GH_PACKAGES_RW }}
      NODE_OPTIONS: --max-old-space-size=3072
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Materialize Changesets base branch
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main origin/main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Configure GitHub Packages read auth
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NARDUK_PLATFORM_GH_PACKAGES_READ:-}"
          umask 077
          cat > "${NPM_CONFIG_USERCONFIG}" <<EOF
          @narduk-enterprises:registry=https://npm.pkg.github.com
          @narduk-geo:registry=https://npm.pkg.github.com
          //npm.pkg.github.com/:_authToken=${NARDUK_PLATFORM_GH_PACKAGES_READ}
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run package quality
        if: ${{ !startsWith(github.head_ref, 'changeset-release/') && !startsWith(github.ref_name, 'changeset-release/') }}
        run: pnpm run quality

      - name: Run generated release artifact quality
        if: ${{ startsWith(github.head_ref, 'changeset-release/') || startsWith(github.ref_name, 'changeset-release/') }}
        run: pnpm run versions:check && pnpm run quality:artifacts

      - name: Check package manifests and pack listings
        run: pnpm run pack:check

      - name: Install packed artifacts outside the workspace
        run: pnpm run release:consumer-smoke

      - name: Remove temporary registry auth
        if: always()
        run: rm -f "${NPM_CONFIG_USERCONFIG}"
