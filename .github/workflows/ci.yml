# The shared callable runs one job per affected library. Repository-owned
# ci:batch runs the same strict package gates as ci:affected/ci:full locally.
# Selection remains dependency-aware; verify covers packages, contracts and
# every applicable browser/consumer gate. Keep ci / Required during migration.
# Planner selection starts the package and integration jobs while contracts run
# alongside them; verify rejects a failed, cancelled or missing contracts gate.
# Public fork CI uses GitHub-hosted runners and no registry credential.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Set concurrency in the CALLER: workflow-level concurrency does not propagate
# from a called reusable workflow.
concurrency:
  # A version commit must finish its publication proof when another PR merges.
  # Ordinary PR and main iterations still replace their superseded runs.
  group: >-
    narduk-libs-ci-${{ github.workflow }}-${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release packages') && github.sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release packages') }}

permissions:
  contents: read

jobs:
  affected:
    name: affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      package-jobs: ${{ steps.plan.outputs.package-jobs }}
      browser-packages: ${{ steps.plan.outputs.browser-packages }}
      packed-consumer: ${{ steps.plan.outputs.packed-consumer }}
      full-run: ${{ steps.plan.outputs.full-run }}
      affected-count: ${{ steps.plan.outputs.affected-count }}
      logging-languages: ${{ steps.plan.outputs.logging-languages }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false

      - name: Compute changed packages and transitive dependents
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--all)
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            args=(--base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}")
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${PUSH_BASE_SHA}" ] &&
            [ "${PUSH_BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            args=(--base "${PUSH_BASE_SHA}" --head "${PUSH_HEAD_SHA}")
          fi
          node scripts/compute-affected-packages.mjs \
            "${args[@]}" \
            --batch-count 8 \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"
          node scripts/logging-ci-plan.mjs "${args[@]}"

  logging-languages:
    needs: [affected]
    if: needs.affected.outputs.logging-languages == 'true'
    uses: ./.github/workflows/logging-languages.yml

  ci:
    needs: [affected]
    uses: narduk-enterprises/workflows/.github/workflows/node-library.yml@d1026b280db8e3a2959a852961d5828f8ea294a9 # public hosted CI and no registry auth
    permissions:
      contents: read
    with:
      runner: '"ubuntu-latest"'
      required-runner: '"ubuntu-latest"'
      # Match the root runtime and the workspace ESLint package's Node 24 minimum.
      node-version: "24.21.0"
      package-manager: pnpm
      # Each matrix entry contains exactly one library. All five gates execute
      # inside ci:batch, in their original order and with transitive selection.
      run-lint: false
      run-typecheck: false
      run-tests: false
      run-build: false
      package-matrix: ${{ needs.affected.outputs.package-jobs }}
      extra-scripts: "ci:batch"
      require-scripts: true
      package-registry-auth: disabled

  contracts:
    # Repository-wide acceptance gate runs alongside selected package jobs.
    # The final verify refuses release when contracts fail or never finish.
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Materialize Changesets base branch
        # `changeset status` resolves .changeset/config.json `baseBranch: main`
        # against a local ref. On a PR the checkout is detached at the merge
        # commit with no `main`, so create it from the checkout's full-history
        # origin/main ref. No second network fetch is needed after checkout.
        run: |
          git rev-parse --verify "refs/remotes/origin/main^{commit}"
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main origin/main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository contracts and formatting
        env:
          IS_CHANGESET_RELEASE: ${{ startsWith(github.head_ref, 'changeset-release/') || startsWith(github.ref_name, 'changeset-release/') }}
        run: |
          set -euo pipefail
          pnpm run versions:check
          pnpm run scripts:test
          if [ "${IS_CHANGESET_RELEASE}" != "true" ]; then
            pnpm run release-plan:check
          fi
          pnpm run format:check

      # Named separately from the combined contracts step above so the gate is
      # visible by name where it actually runs. `pnpm run quality` /
      # `quality:artifacts` (which chains `surface:check`) never appears in
      # this workflow, `release.yml` or `logging-languages.yml`, and the
      # per-package `ci:batch` gate list (scripts/ci-package-plan.mjs) cannot
      # carry a root-level script -- so before this step, `surface:check` only
      # ran as an accidental side effect of `pnpm run scripts:test` invoking
      # `scripts/check-component-surface.test.mjs`, which calls the real
      # script with no args and no try/catch (narduk-libs#282). That coverage
      # stays in place; this step makes the gate itself the named, intentional
      # thing that runs in CI rather than a side effect nothing would notice
      # removing.
      - name: Check component surface (README, tests, design card per export)
        run: |
          set -euo pipefail
          pnpm run surface:check

  packed-consumer-smoke:
    # Build every publishable package, then run Chromium and platform gates.
    name: package / packed-consumer-smoke
    needs: [affected]
    if: needs.affected.outputs.packed-consumer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      # Bound parent and nested pnpm lifecycle Node heaps.
      NODE_OPTIONS: --max-old-space-size=2048
      npm_config_node_options: --max-old-space-size=2048
      # narduk-charts' build script overrides NODE_OPTIONS from this value.
      NARDUK_BUILD_MAX_OLD_SPACE_SIZE: "2048"
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo-cache
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Point TMPDIR at disk, outside the checkout
        # The fixture must live outside the workspace: pnpm otherwise finds
        # pnpm-workspace.yaml and treats it as another workspace member.
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/consumer-smoke"
          mkdir -p "${tmp}"
          echo "TMPDIR=${tmp}" >>"${GITHUB_ENV}"
          df -h "${tmp}" | tail -1

      - name: Materialize Changesets base branch
        run: |
          git rev-parse --verify "refs/remotes/origin/main^{commit}"
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main origin/main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      # Share one store across the root and every external consumer install.
      - name: Share a job-local pnpm store across consumer installs
        run: |
          set -euo pipefail
          store="${RUNNER_TEMP}/pnpm-store"
          mkdir -p "${store}"
          echo "npm_config_store_dir=${store}" >>"${GITHUB_ENV}"

      # The packed consumer's root install is cold on every fresh hosted VM.
      # Restore the store seeded by a successful main run before the root and
      # external installs. On its first run, warm the root from the existing
      # browser job's main-only cache; the consumer's later main run saves its
      # own expanded store with generated-app dependencies. A lockfile change
      # can reuse unchanged content from the previous store; frozen installs
      # still resolve and verify the current lockfile.
      - name: Restore pnpm store cache
        id: pnpm-store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: narduk-libs-packed-consumer-pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            narduk-libs-journeys-e2e-pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
            narduk-libs-packed-consumer-pnpm-store-${{ runner.os }}-

      # Turbo's content hashes invalidate stale restored build output.
      - name: Restore turbo build cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.turbo-cache
          key: narduk-libs-packed-consumer-turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            narduk-libs-packed-consumer-turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release packages and install Chromium in parallel
        # Public ubuntu-latest has 4 CPUs / 16 GiB; keep each Node heap at 2 GiB.
        run: node scripts/prepare-packed-consumer.mjs --install-browser --build-concurrency=4

      - name: Prove packed artifacts in an external generated consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run release:consumer-smoke

      - name: Retain the exact installed consumer proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-consumer-proof-${{ github.run_attempt }}
          path: .ci-evidence/packed-consumer-proof/proof.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      # Write on main so every PR can restore the compiled-artifact cache,
      # rather than creating a private entry that later runs cannot use.
      - name: Save turbo build cache
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.turbo-cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      # Only successful main runs can seed caches later PRs can read; never
      # upload a PR-authored store into the shared cache namespace.
      - name: Save pnpm store cache
        if: >-
          steps.pnpm-store-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

  package-browser-tests:
    # Every selected package declaring test:e2e shares this one install. This
    # includes journeys and charts; general package jobs never launch browsers.
    name: package / browser tests
    needs: [affected]
    if: needs.affected.outputs.browser-packages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0

      # Each hosted job has a private store; restore from the lockfile cache.
      - name: Resolve pnpm store cache directory
        id: pnpm-store
        run: |
          set -euo pipefail
          store="${RUNNER_TEMP}/pnpm-store"
          mkdir -p "${store}"
          echo "npm_config_store_dir=${store}" >>"${GITHUB_ENV}"
          echo "path=${store}" >>"${GITHUB_OUTPUT}"

      - name: Restore pnpm store cache
        id: pnpm-store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: narduk-libs-journeys-e2e-pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            narduk-libs-journeys-e2e-pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and Linux browser dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Run every selected package browser suite
        env:
          BROWSER_PACKAGES_JSON: ${{ needs.affected.outputs.browser-packages }}
          NARDUK_BUILD_MAX_OLD_SPACE_SIZE: "2048"
        run: node scripts/ci-packages.mjs --browser

      # Only the default branch writes -- see packed-consumer-smoke's
      # identically reasoned `Save pnpm store cache` step above.
      - name: Save pnpm store cache
        if: >-
          steps.pnpm-store-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

  verify:
    # Complete acceptance boundary, including integrations outside the callable.
    name: verify
    if: always()
    needs:
      [affected, ci, contracts, packed-consumer-smoke, package-browser-tests, logging-languages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every gate
        env:
          AFFECTED_RESULT: ${{ needs.affected.result }}
          CI_RESULT: ${{ needs.ci.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          AFFECTED_COUNT: ${{ needs.affected.outputs.affected-count }}
          PACKED_CONSUMER_EXPECTED: ${{ needs.affected.outputs.packed-consumer }}
          PACKED_CONSUMER_SMOKE_RESULT: ${{ needs.packed-consumer-smoke.result }}
          BROWSER_EXPECTED: ${{ needs.affected.outputs.browser-packages != '[]' }}
          BROWSER_RESULT: ${{ needs.package-browser-tests.result }}
          LOGGING_EXPECTED: ${{ needs.affected.outputs.logging-languages }}
          LOGGING_RESULT: ${{ needs.logging-languages.result }}
        run: |
          set -euo pipefail
          status=0
          if [ "${LOGGING_EXPECTED}" = "true" ]; then
            test "${LOGGING_RESULT}" = success || status=1
          elif [ "${LOGGING_EXPECTED}" = "false" ]; then
            test "${LOGGING_RESULT}" = skipped || status=1
          else
            echo "::error::Planner did not report logging language applicability"
            status=1
          fi
          if ! [[ "${AFFECTED_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::Planner did not report a valid package count"
            status=1
          fi
          case "${PACKED_CONSUMER_EXPECTED}" in
            true|false) ;;
            *) echo "::error::Planner did not report consumer applicability"; status=1 ;;
          esac
          case "${BROWSER_EXPECTED}" in
            true|false) ;;
            *) echo "::error::Planner did not report browser applicability"; status=1 ;;
          esac
          for gate in AFFECTED CI CONTRACTS; do
            eval "result=\${${gate}_RESULT}"
            if [ "${result}" != "success" ]; then
              echo "::error::${gate} gate reported '${result}'"
              status=1
            fi
          done
          if [ "${PACKED_CONSUMER_EXPECTED}" = "true" ]; then
            if [ "${PACKED_CONSUMER_SMOKE_RESULT}" != "success" ]; then
              echo "::error::PACKED_CONSUMER_SMOKE was required but reported '${PACKED_CONSUMER_SMOKE_RESULT}'"
              status=1
            fi
          elif [ "${PACKED_CONSUMER_SMOKE_RESULT}" != "skipped" ]; then
            echo "::error::PACKED_CONSUMER_SMOKE was not applicable but reported '${PACKED_CONSUMER_SMOKE_RESULT}'"
            status=1
          fi
          if [ "${BROWSER_EXPECTED}" = "true" ]; then
            if [ "${BROWSER_RESULT}" != "success" ]; then
              echo "::error::BROWSER was required but reported '${BROWSER_RESULT}'"
              status=1
            fi
          elif [ "${BROWSER_RESULT}" != "skipped" ]; then
            echo "::error::BROWSER was not applicable but reported '${BROWSER_RESULT}'"
            status=1
          fi
          exit "${status}"
