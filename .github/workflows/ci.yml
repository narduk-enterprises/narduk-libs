# The shared callable installs once per bounded batch. Repository-owned
# ci:batch runs the same strict package gates as ci:affected/ci:full locally.
# Selection remains dependency-aware; verify covers packages, contracts and
# every applicable browser/consumer gate. Keep ci / Required during migration.
# Runner routes are resolved from fleet; no host-specific tuning belongs here.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Set concurrency in the CALLER: workflow-level concurrency does not propagate
# from a called reusable workflow.
concurrency:
  # A version commit must finish its publication proof when another PR merges.
  # Ordinary PR and main iterations still replace their superseded runs.
  group: >-
    narduk-libs-ci-${{ github.workflow }}-${{ (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: release packages') && github.sha) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: >-
    ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: release packages') }}

permissions:
  contents: read

jobs:
  affected:
    # Secrets-free release gate: company-hq CI runner policy exception 2.
    # Planning must not wait for a package-build execution slot.
    name: affected packages
    runs-on: ${{ fromJSON(vars.CI_LIGHTWEIGHT_RUNNER || '"ubuntu-slim"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      batches: ${{ steps.plan.outputs.batches }}
      browser-packages: ${{ steps.plan.outputs.browser-packages }}
      packed-consumer: ${{ steps.plan.outputs.packed-consumer }}
      full-run: ${{ steps.plan.outputs.full-run }}
      affected-count: ${{ steps.plan.outputs.affected-count }}
      logging-languages: ${{ steps.plan.outputs.logging-languages }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Compute changed packages and transitive dependents
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--all)
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            args=(--base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}")
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${PUSH_BASE_SHA}" ] &&
            [ "${PUSH_BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            args=(--base "${PUSH_BASE_SHA}" --head "${PUSH_HEAD_SHA}")
          fi
          node scripts/compute-affected-packages.mjs \
            "${args[@]}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"
          node scripts/logging-ci-plan.mjs "${args[@]}"

  logging-languages:
    needs: affected
    if: needs.affected.outputs.logging-languages == 'true'
    uses: ./.github/workflows/logging-languages.yml

  ci:
    needs: affected
    uses: narduk-enterprises/workflows/.github/workflows/node-library.yml@8cd24c16a1054723e599f62edbfccfcaa8ed0e8c # central lightweight gate route
    # A called workflow cannot request MORE than the caller grants, and
    # node-library.yml's package job asks for `packages: read` to reach the
    # GitHub Packages registry. Without this the run does not fail a step -- it
    # fails to START (`startup_failure`, no logs, no annotation).
    permissions:
      contents: read
      packages: read
    with:
      # Verbatim `runsOn` from Config/github-runner-fleet.json via
      # scripts/github_runner_fleet.py route (organization scope, linux-ci).
      runner: '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}'
      # Exact version the old workflow pinned, matching the root `volta.node`.
      node-version: "22.22.3"
      package-manager: pnpm
      # All five package gates execute inside ci:batch, in their original order.
      run-lint: false
      run-typecheck: false
      run-tests: false
      run-build: false
      package-matrix: ${{ needs.affected.outputs.batches }}
      extra-scripts: "ci:batch"
      require-scripts: true
    secrets:
      NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}

  contracts:
    # The old `repository-contracts` matrix lane, kept as its own job. See the
    # CONTRACTS section in the header for the three reasons it cannot be a
    # package-matrix lane. Unchanged in substance from the lane it replaces.
    name: contracts
    runs-on:
      group: linux-ci
      labels: [self-hosted, Linux, X64, proxmox, linux-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Materialize Changesets base branch
        # `changeset status` resolves .changeset/config.json `baseBranch: main`
        # against a local ref. On a PR the checkout is detached at the merge
        # commit with no `main`, so create it from the fetched remote.
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main origin/main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Configure GitHub Packages read auth
        run: node ./scripts/package-registry-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository contracts and formatting
        env:
          IS_CHANGESET_RELEASE: ${{ startsWith(github.head_ref, 'changeset-release/') || startsWith(github.ref_name, 'changeset-release/') }}
        run: |
          set -euo pipefail
          pnpm run versions:check
          pnpm run scripts:test
          if [ "${IS_CHANGESET_RELEASE}" != "true" ]; then
            pnpm run release-plan:check
          fi
          pnpm run format:check

      - name: Remove temporary registry auth
        if: always()
        run: rm -f "${NPM_CONFIG_USERCONFIG}"

  packed-consumer-smoke:
    # Unchanged by the #278 adoption. This is the only lane that installs and
    # launches a real browser (Playwright chromium, via the generated app's
    # `quality` gate inside scripts/release-packages.mjs), so it runs on the
    # dedicated playwright-isolated pool. node-library.yml has NO browser lane
    # and no input that could express one, so this job cannot move into the
    # callable and stays here by design -- recorded as a kept-separate lane
    # against #278, not as residue.
    name: package / packed-consumer-smoke
    needs: affected
    if: needs.affected.outputs.packed-consumer == 'true'
    runs-on:
      group: playwright-isolated
      labels: [self-hosted, Linux, X64, proxmox-playwright-x64]
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    env:
      GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
      # Keep the temp working set OFF the guest's RAM.
      #
      # The playwright pool's runner cycle exports TMPDIR into
      # /run/playwright-ephemeral/job-tmp, and /run in those guests is a tmpfs
      # sized 13G while the cgroup limit is 4096 MiB -- LXC sized that tmpfs
      # against the host's 64 GiB, not the container's. So every byte this job
      # writes to TMPDIR is guest memory, and `swap: 0` means none of it can be
      # evicted. Installing and building a whole generated Nuxt app there, on
      # top of the heap below, is what OOM-killed this lane twice on
      # 2026-08-31/09-01 -- surfacing to GitHub as the misleading "The runner
      # has received a shutdown signal" rather than as an out-of-memory error.
      #
      # TMPDIR is NOT set here. It is exported by the step below instead --
      # see that step for why a job-level value cannot express it.
      #
      # Tracked upstream as fleet#196 and agent-infrastructure#1007; the
      # override below is the repository's own half and stands however those
      # land.
      # 3072 was over-committed against a 4096 MiB guest even before TMPDIR is
      # counted. 2048 leaves headroom for pnpm, esbuild workers and the browser
      # the smoke launches, and no lane has needed the larger heap.
      NODE_OPTIONS: --max-old-space-size=2048
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
      # Pool guests are ephemeral one-job sandboxes without the linux-ci shared
      # cache mount; keep the turbo cache workspace-local here.
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo-cache
      # The pool's browser binaries are immutable under /opt (downloads are
      # deliberately blocked); Playwright must resolve them from there.
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-ci/browsers
      # Consumed by assertIsolatedPlaywrightToolchain() in
      # scripts/release-packages.mjs (company-hq#343 fail-closed preflight,
      # same idiom as the workflows repo's shared callables). The function
      # defaults to these exact values when unset, but they are declared
      # explicitly here to match the other isolated-pool jobs' idiom.
      PLAYWRIGHT_TOOLCHAIN_ROOT: /opt/playwright-ci
      PLAYWRIGHT_TOOLCHAIN_OWNER_UID: "0"
      PLAYWRIGHT_ALLOWED_BROWSER_PREFIX: /opt
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Point TMPDIR at disk, outside the checkout
        # WHY THIS IS A STEP AND NOT A JOB-LEVEL `env:` VALUE.
        #
        # The destination has to satisfy three things at once, and only
        # RUNNER_TEMP does:
        #
        #   on disk, not tmpfs  -- /run in these guests is a tmpfs sized 13G
        #     inside a 4096 MiB cgroup, so the default TMPDIR makes every
        #     temp byte guest RAM and OOM-kills this job mid-install.
        #   OUTSIDE github.workspace -- a first attempt put it at
        #     ${{ github.workspace }}/.job-tmp, and pnpm then walked up from
        #     the generated consumer, found this repo's pnpm-workspace.yaml,
        #     and resolved the consumer as a workspace member. The install
        #     "succeeded" and left no node_modules in the consumer, failing
        #     later with a confusing ENOENT on create-narduk-app/package.json.
        #   expressible -- the `runner` context is unavailable in a job-level
        #     `env:` block, where ${{ runner.temp }} silently expands to the
        #     empty string and un-sets TMPDIR rather than failing.
        #
        # $RUNNER_TEMP is the same directory the `runner` context would name,
        # readable as a plain shell variable at step level. Exporting through
        # $GITHUB_ENV applies it to every later step, which is why this sits
        # before all of them.
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/consumer-smoke"
          mkdir -p "${tmp}"
          echo "TMPDIR=${tmp}" >>"${GITHUB_ENV}"
          df -h "${tmp}" | tail -1

      - name: Materialize Changesets base branch
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main origin/main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      # The large dependency archive costs more to restore than a fresh
      # install on this pool. Keep one job-local store: the root installation
      # warms the external packed consumer and both generated-app installs.
      # Guest destruction removes it; no cross-job state or archive is needed.
      - name: Share a job-local pnpm store across consumer installs
        run: |
          set -euo pipefail
          store="${RUNNER_TEMP}/pnpm-store"
          mkdir -p "${store}"
          echo "npm_config_store_dir=${store}" >>"${GITHUB_ENV}"

      # Retain the much smaller compiled-artifact cache. Turbo's own
      # content hashing makes a stale or partial restore harmless -- a task
      # whose inputs changed just misses and rebuilds, exactly as it would
      # with an empty cache-dir -- so the key only needs to always resolve to
      # the most recent entry, never an exact match.
      - name: Restore turbo build cache
        id: turbo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.turbo-cache
          key: narduk-libs-packed-consumer-turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            narduk-libs-packed-consumer-turbo-${{ runner.os }}-

      - name: Configure GitHub Packages read auth
        run: node ./scripts/package-registry-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build coordinated release set
        run: >-
          pnpm exec turbo run build --filter='./packages/*/*'
          --concurrency=1 --cache-dir="${TURBO_CACHE_DIR}" --cache-workers=4

      - name: Prove packed artifacts in an external generated consumer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run release:consumer-smoke

      - name: Retain the exact installed consumer proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packed-consumer-proof-${{ github.run_attempt }}
          path: .ci-evidence/packed-consumer-proof/proof.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

      # Write on main so every PR can restore the compiled-artifact cache,
      # rather than creating a private entry that later runs cannot use.
      - name: Save turbo build cache
        if: github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.turbo-cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      - name: Remove temporary registry auth
        if: always()
        run: rm -f "${NPM_CONFIG_USERCONFIG}"

  package-browser-tests:
    # Every selected package declaring test:e2e shares this one install. This
    # includes journeys and charts; general package batches never launch browsers.
    name: package / browser tests
    needs: affected
    if: needs.affected.outputs.browser-packages != '[]'
    runs-on:
      group: playwright-isolated
      labels: [self-hosted, Linux, X64, proxmox-playwright-x64]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-ci/browsers
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      # Same ephemeral-pool reasoning as packed-consumer-smoke's identically
      # named step above: this pool has no persistent local store at all, and
      # (unlike linux-ci) no concurrent lane ever shares this guest's
      # filesystem while this job runs, so `actions/cache` is sound here.
      - name: Resolve pnpm store cache directory
        id: pnpm-store
        run: |
          set -euo pipefail
          store="${RUNNER_TEMP}/pnpm-store"
          mkdir -p "${store}"
          echo "npm_config_store_dir=${store}" >>"${GITHUB_ENV}"
          echo "path=${store}" >>"${GITHUB_OUTPUT}"

      - name: Restore pnpm store cache
        id: pnpm-store-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: narduk-libs-journeys-e2e-pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            narduk-libs-journeys-e2e-pnpm-store-${{ runner.os }}-

      - name: Configure GitHub Packages read auth
        run: node ./scripts/package-registry-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run every selected package browser suite
        env:
          BROWSER_PACKAGES_JSON: ${{ needs.affected.outputs.browser-packages }}
          NARDUK_BUILD_MAX_OLD_SPACE_SIZE: "2048"
        run: node scripts/ci-packages.mjs --browser

      # Only the default branch writes -- see packed-consumer-smoke's
      # identically reasoned `Save pnpm store cache` step above.
      - name: Save pnpm store cache
        if: >-
          steps.pnpm-store-cache.outputs.cache-hit != 'true'
          && github.ref_name == github.event.repository.default_branch
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-store-cache.outputs.cache-primary-key }}

      - name: Remove temporary registry auth
        if: always()
        run: rm -f "${NPM_CONFIG_USERCONFIG}"

  verify:
    # Complete acceptance boundary, including integrations outside the callable.
    name: verify
    if: always()
    needs:
      [affected, ci, contracts, packed-consumer-smoke, package-browser-tests, logging-languages]
    # Secrets-free gate before the privileged self-hosted release (policy §2.2).
    runs-on: ${{ fromJSON(vars.CI_LIGHTWEIGHT_RUNNER || '"ubuntu-slim"') }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every gate
        env:
          AFFECTED_RESULT: ${{ needs.affected.result }}
          CI_RESULT: ${{ needs.ci.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          AFFECTED_COUNT: ${{ needs.affected.outputs.affected-count }}
          PACKED_CONSUMER_EXPECTED: ${{ needs.affected.outputs.packed-consumer }}
          PACKED_CONSUMER_SMOKE_RESULT: ${{ needs.packed-consumer-smoke.result }}
          BROWSER_EXPECTED: ${{ needs.affected.outputs.browser-packages != '[]' }}
          BROWSER_RESULT: ${{ needs.package-browser-tests.result }}
          LOGGING_EXPECTED: ${{ needs.affected.outputs.logging-languages }}
          LOGGING_RESULT: ${{ needs.logging-languages.result }}
        run: |
          set -euo pipefail
          status=0
          if [ "${LOGGING_EXPECTED}" = "true" ]; then
            test "${LOGGING_RESULT}" = success || status=1
          elif [ "${LOGGING_EXPECTED}" = "false" ]; then
            test "${LOGGING_RESULT}" = skipped || status=1
          else
            echo "::error::Planner did not report logging language applicability"
            status=1
          fi
          if ! [[ "${AFFECTED_COUNT}" =~ ^[0-9]+$ ]]; then
            echo "::error::Planner did not report a valid package count"
            status=1
          fi
          case "${PACKED_CONSUMER_EXPECTED}" in
            true|false) ;;
            *) echo "::error::Planner did not report consumer applicability"; status=1 ;;
          esac
          case "${BROWSER_EXPECTED}" in
            true|false) ;;
            *) echo "::error::Planner did not report browser applicability"; status=1 ;;
          esac
          for gate in AFFECTED CI CONTRACTS; do
            eval "result=\${${gate}_RESULT}"
            if [ "${result}" != "success" ]; then
              echo "::error::${gate} gate reported '${result}'"
              status=1
            fi
          done
          if [ "${PACKED_CONSUMER_EXPECTED}" = "true" ]; then
            if [ "${PACKED_CONSUMER_SMOKE_RESULT}" != "success" ]; then
              echo "::error::PACKED_CONSUMER_SMOKE was required but reported '${PACKED_CONSUMER_SMOKE_RESULT}'"
              status=1
            fi
          elif [ "${PACKED_CONSUMER_SMOKE_RESULT}" != "skipped" ]; then
            echo "::error::PACKED_CONSUMER_SMOKE was not applicable but reported '${PACKED_CONSUMER_SMOKE_RESULT}'"
            status=1
          fi
          if [ "${BROWSER_EXPECTED}" = "true" ]; then
            if [ "${BROWSER_RESULT}" != "success" ]; then
              echo "::error::BROWSER was required but reported '${BROWSER_RESULT}'"
              status=1
            fi
          elif [ "${BROWSER_RESULT}" != "skipped" ]; then
            echo "::error::BROWSER was not applicable but reported '${BROWSER_RESULT}'"
            status=1
          fi
          exit "${status}"
