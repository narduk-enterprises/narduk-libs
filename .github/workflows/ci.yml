# Calls the shared node-library CI gate instead of carrying a local copy of the
# checkout/pnpm/setup-node/install/lint/typecheck/build/test shape
# (company-hq#278, D-WF-1: every app of a class uses that class's callable from
# narduk-enterprises/workflows). Pinned to the exact commit currently named
# `v1`; never @main or a moving major tag. This makes a callable update an
# explicit change to this workflow, which is a full-fan-out trigger below.
#
# The calling job id MUST stay `ci`. GitHub composes a called workflow's check
# context as `<caller job id> / <called job name>`, and the reusable workflow's
# last job is named exactly `Required`, so this produces `ci / Required` -- the
# one string every adopting repo reports.
#
# SPECIAL STANDING: node-library.yml's `package-matrix` input was GENERALIZED
# FROM this file. The old `package-gates` matrix + `verify` aggregator is the
# shape the callable's matrix + `Required` job turned into a template, so the
# structural fit here is by construction. What follows is the accounting for
# the details that did NOT generalize.
#
# AFFECTED SET: `affected` discovers every package from pnpm-workspace.yaml,
# builds the dependency graph from the workspace package manifests, and passes
# changed packages plus every transitive dependent to the callable. No package
# list or dependency edge is maintained in YAML. Root dependency/config/tooling
# files and this workflow force the complete matrix. Manual dispatch is always
# complete. The selected and omitted package names are recorded in the planner
# job summary.
#
# RUNNER ROUTE: manifest-resolved, not hand-written.
#   python3 scripts/github_runner_fleet.py route \
#     --repository narduk-enterprises/narduk-libs --visibility private
# returns the `linux-ci` ORGANIZATION group; its `runsOn` object is pasted
# verbatim below. Org repos must pin the group -- a labels-only `runs-on` can
# match the credentialed deploy class and land a PR job on the deploy host.
# This also widens the label set the previous file carried by hand
# (`[self-hosted, linux-ci]`) back to the manifest's full list.
#
# ============================ LANE-BY-LANE ACCOUNTING ========================
# Every step of the hand-rolled gate, and where it went. Nothing is dropped
# silently; the two genuine losses are called out under RESIDUE below.
#
# package-gates matrix (12 lanes) -> `ci` (11 lanes) + `contracts` (1 job)
#   checkout / pnpm 10.33.4 / node 22.22.3  -> callable's equivalent steps.
#                                              pnpm/action-setup reads the same
#                                              pin from `packageManager`.
#   Configure GitHub Packages read auth     -> scripts/package-registry-auth.mjs,
#                                              the exact path the callable probes
#                                              for. narduk-libs CANNOT take the
#                                              callable's "no auth script, skip"
#                                              branch: the root devDependency
#                                              @narduk-enterprises/eslint-config
#                                              comes from GitHub Packages and the
#                                              install 401s without a token.
#   pnpm install --frozen-lockfile          -> callable's install step (identical).
#   turbo run lint    --filter=<pkg>        -> `run-lint` lane (see TURBO below).
#   turbo run typecheck --filter=<pkg>      -> `run-typecheck` lane.
#   turbo run build   --filter=<pkg>        -> `run-build` lane.
#   pnpm --filter <pkg> run test:unit       -> `extra-scripts`, NOT `run-tests`
#                                              (see TESTS below).
#   publint <dir> --strict
#     && pnpm --dir <dir> pack --dry-run    -> `extra-scripts` as `check:package`,
#                                              a new script in all 11 packages.
#   Remove temporary registry auth          -> DROPPED; see RESIDUE.
#   contracts lane (versions:check,
#     release-plan:check, format:check)     -> KEPT as the separate `contracts`
#                                              job below (see CONTRACTS).
#   per-lane NODE_OPTIONS                   -> .npmrc `node-options` (see HEAP).
# packed-consumer-smoke                     -> KEPT as a separate job, unchanged.
# journeys-e2e                              -> NEW browser lane (same reasoning as
#                                              packed-consumer-smoke: node-library.yml
#                                              has no browser lane), pool-routed,
#                                              conditional on the journeys package
#                                              being in the affected matrix.
# verify                                    -> KEPT as the `verify` roll-up below.
#
# ------------------------------- TESTS --------------------------------------
# `run-tests: false` IS NOT A DISABLED TEST GATE -- read this before reacting.
# Not one of the 11 packages defines a script called `test`; they all define
# `test:unit` (root `pnpm run test` fans out to `-r --if-present test:unit`).
# The callable's test lane runs `run --if-present test`, so leaving
# `run-tests: true` would have matched nothing in all 11 lanes and silently
# turned every unit test into a green no-op. That is the exact silent loss this
# adoption is supposed to prevent, so tests run through `extra-scripts` under
# their real name instead, which also preserves the ORIGINAL STEP ORDER:
# lint -> typecheck -> build -> test:unit -> check:package. Aliasing `test` to
# `test:unit` in 11 packages would have let `run-tests: true` be literally true,
# but the callable runs tests BEFORE build, and reordering a gate is a bigger
# behaviour change than renaming where it is declared.
#
# ------------------------------- HEAP ---------------------------------------
# The old matrix set a per-package NODE_OPTIONS heap ceiling (1024-2560 MiB) as
# job `env:`. The callable has no env input, so it moved to `node-options` in
# .npmrc, where it also governs a developer's local run -- see the long note in
# that file for why a single 3072 MiB ceiling is non-regressive against every
# value the old workflows used, including the 3072 that packed-consumer-smoke
# and release.yml still set.
#
# ------------------------------ CONTRACTS -----------------------------------
# The repository-contracts lane is a SEPARATE JOB, not a `package-matrix` lane,
# for three independent reasons:
#   1. Its filter would have to be "" (repo root), and the callable's
#      run-lint/run-typecheck/run-build switches are workflow-wide, not
#      per-lane. A root lane would therefore also run root `lint`/`typecheck`/
#      `build`, each of which is `turbo run ... --filter='./packages/*'` -- the
#      entire monorepo, serially, in one lane. That is precisely the monolith
#      the 11-lane split exists to avoid.
#   2. `pnpm run release-plan:check` shells out to `changeset status`, which
#      resolves .changeset/config.json's `baseBranch: main` against a LOCAL
#      `main` ref. That needs `fetch-depth: 0` plus the base-branch
#      materialization step below; the callable checks out at depth 1 with
#      `persist-credentials: false` and has no input for either.
#   3. It carries an `IS_CHANGESET_RELEASE` condition that skips
#      release-plan:check on `changeset-release/*` branches -- release
#      machinery, which stays per-repo by class policy, and which the callable
#      deliberately does not model.
# The gate is NOT weakened: the same three checks run on the same events, they
# are simply reported as `contracts` rather than as a matrix lane.
#
# ------------------------------- TURBO --------------------------------------
# The callable invokes each package's own scripts, so CI no longer goes through
# `turbo run` and no longer uses the shared host cache at
# /srv/github-runners/_cache/turbo/narduk-libs. Correctness is unaffected and
# was verified rather than assumed: turbo.json gives `^build` to the `build`
# task ONLY (lint/typecheck depend on `nuxt:prepare`/`eslint:typegen`, which
# each package re-runs itself via its own `prelint`/`pretypecheck` hooks), and
# the one cross-package BUILD artifact -- narduk-platform's dist/, consumed by
# narduk-core -- is materialized at install time by narduk-platform's own
# `prepare` lifecycle script (scripts/ensure-dist.mjs), confirmed on a clean
# `pnpm install --frozen-lockfile` locally. Root `pnpm run build` still uses
# turbo for developers. The lost CI cache is a SPEED regression only, recorded
# against #278.
#
# >>>>>>>>>>>>>>>>>>>>>>>>>>>>>>> RESIDUE <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<
# 1. `rm -f .npmrc.auth` no longer runs in the matrix lanes. The callable
#    writes the credential (via the script above) but has no teardown step and
#    a caller cannot inject one into a called workflow. On these PERSISTENT
#    self-hosted runners the 0600 file therefore survives between runs, until
#    the next actions/checkout `git clean -ffdx` removes it. Mitigated but not
#    eliminated: the file is mode 0600, gitignored, and the token is a
#    read-only packages credential. The `contracts` and `packed-consumer-smoke`
#    jobs below still clean up after themselves. This is a gap in the CALLABLE,
#    reported against #278 rather than worked around here.
# 2. The shared turbo cache (see TURBO above) -- speed only, not coverage.
# ============================================================================

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Set concurrency in the CALLER: workflow-level concurrency does not propagate
# from a called reusable workflow.
concurrency:
  group: narduk-libs-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  affected:
    name: affected packages
    runs-on:
      group: linux-ci
      labels: [self-hosted, Linux, X64, proxmox, linux-ci]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      packed-consumer: ${{ steps.plan.outputs.packed-consumer }}
      full-run: ${{ steps.plan.outputs.full-run }}
      affected-count: ${{ steps.plan.outputs.affected-count }}
    steps:
      - name: Check out source and comparison history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3
          package-manager-cache: false

      - name: Compute changed packages and transitive dependents
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          args=(--all)
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            args=(--base "${PR_BASE_SHA}" --head "${PR_HEAD_SHA}")
          elif [ "${EVENT_NAME}" = "push" ] && [ -n "${PUSH_BASE_SHA}" ] &&
            [ "${PUSH_BASE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            args=(--base "${PUSH_BASE_SHA}" --head "${PUSH_HEAD_SHA}")
          fi
          node scripts/compute-affected-packages.mjs \
            "${args[@]}" \
            --github-output "${GITHUB_OUTPUT}" \
            --summary "${GITHUB_STEP_SUMMARY}"

  ci:
    needs: affected
    uses: narduk-enterprises/workflows/.github/workflows/node-library.yml@c8b5e164fc1bd680eb7644b4f4c093ef6033aad2 # v1
    # A called workflow cannot request MORE than the caller grants, and
    # node-library.yml's package job asks for `packages: read` to reach the
    # GitHub Packages registry. Without this the run does not fail a step -- it
    # fails to START (`startup_failure`, no logs, no annotation).
    permissions:
      contents: read
      packages: read
    with:
      # Verbatim `runsOn` from Config/github-runner-fleet.json via
      # scripts/github_runner_fleet.py route (organization scope, linux-ci).
      runner: '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}'
      # Exact version the old workflow pinned, matching the root `volta.node`.
      node-version: "22.22.3"
      package-manager: pnpm
      run-lint: true
      run-typecheck: true
      # NOT a disabled gate -- unit tests run via extra-scripts under their real
      # script name `test:unit`. See the TESTS section in the header.
      run-tests: false
      run-build: true
      # Generated from pnpm-workspace.yaml and package.json dependency edges by
      # `affected`; an empty matrix is a planner failure, never a green no-op.
      package-matrix: ${{ needs.affected.outputs.matrix }}
      # Run after build, in the same lane, so they see the build output. This
      # ordering is load-bearing and was proven locally: `check:package` in
      # create-narduk-app fails publint ("pkg.exports[.].types is
      # ./dist/index.d.ts but the file does not exist") when run before its
      # build, and passes after it.
      extra-scripts: "test:unit check:package"
      # All eleven packages define both extra scripts as well as their enabled
      # standard lanes. A missing name is a required failure, never a soft skip.
      require-scripts: true
    secrets:
      NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}

  contracts:
    # The old `repository-contracts` matrix lane, kept as its own job. See the
    # CONTRACTS section in the header for the three reasons it cannot be a
    # package-matrix lane. Unchanged in substance from the lane it replaces.
    name: contracts
    runs-on:
      group: linux-ci
      labels: [self-hosted, Linux, X64, proxmox, linux-ci]
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Materialize Changesets base branch
        # `changeset status` resolves .changeset/config.json `baseBranch: main`
        # against a local ref. On a PR the checkout is detached at the merge
        # commit with no `main`, so create it from the fetched remote.
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main origin/main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Configure GitHub Packages read auth
        run: node ./scripts/package-registry-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check repository contracts and formatting
        env:
          IS_CHANGESET_RELEASE: ${{ startsWith(github.head_ref, 'changeset-release/') || startsWith(github.ref_name, 'changeset-release/') }}
        run: |
          set -euo pipefail
          pnpm run versions:check
          pnpm run scripts:test
          if [ "${IS_CHANGESET_RELEASE}" != "true" ]; then
            pnpm run release-plan:check
          fi
          pnpm run format:check

      - name: Remove temporary registry auth
        if: always()
        run: rm -f "${NPM_CONFIG_USERCONFIG}"

  packed-consumer-smoke:
    # Unchanged by the #278 adoption. This is the only lane that installs and
    # launches a real browser (Playwright chromium, via the generated app's
    # `quality` gate inside scripts/release-packages.mjs), so it runs on the
    # dedicated playwright-isolated pool. node-library.yml has NO browser lane
    # and no input that could express one, so this job cannot move into the
    # callable and stays here by design -- recorded as a kept-separate lane
    # against #278, not as residue.
    name: package / packed-consumer-smoke
    needs: affected
    if: needs.affected.outputs.packed-consumer == 'true'
    runs-on:
      group: playwright-isolated
      labels: [self-hosted, Linux, X64, proxmox-playwright-x64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
      NODE_OPTIONS: --max-old-space-size=3072
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
      # Pool guests are ephemeral one-job sandboxes without the linux-ci shared
      # cache mount; keep the turbo cache workspace-local here.
      TURBO_CACHE_DIR: ${{ github.workspace }}/.turbo-cache
      # The pool's browser binaries are immutable under /opt (downloads are
      # deliberately blocked); Playwright must resolve them from there.
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-ci/browsers
      # Consumed by assertIsolatedPlaywrightToolchain() in
      # scripts/release-packages.mjs (company-hq#343 fail-closed preflight,
      # same idiom as the workflows repo's shared callables). The function
      # defaults to these exact values when unset, but they are declared
      # explicitly here to match the other isolated-pool jobs' idiom.
      PLAYWRIGHT_TOOLCHAIN_ROOT: /opt/playwright-ci
      PLAYWRIGHT_TOOLCHAIN_OWNER_UID: "0"
      PLAYWRIGHT_ALLOWED_BROWSER_PREFIX: /opt
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Materialize Changesets base branch
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if [ "$(git branch --show-current)" != "main" ]; then
            git branch --force main origin/main
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Configure GitHub Packages read auth
        run: node ./scripts/package-registry-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build coordinated release set
        run: >-
          pnpm exec turbo run build --filter='./packages/*'
          --concurrency=1 --cache-dir="${TURBO_CACHE_DIR}" --cache-workers=4

      - name: Prove packed artifacts in an external generated consumer
        run: pnpm run release:consumer-smoke

      - name: Remove temporary registry auth
        if: always()
        run: rm -f "${NPM_CONFIG_USERCONFIG}"

  journeys-e2e:
    # The @narduk-enterprises/journeys package's real-browser engine test
    # (tests/web-e2e.test.ts): headless Chromium drives the built package
    # against a fixture world in test and capture modes. The linux-ci package
    # lane is browserless by design (see packed-consumer-smoke's comment), and
    # the pool's toolchain is immutable under /opt with downloads blocked, so
    # the suite resolves browsers via PLAYWRIGHT_BROWSERS_PATH and installs
    # nothing. One job, one worker — proportionate to a sub-minute package
    # suite; the sharded workflow contract in proxmox-playwright-ci is for app
    # E2E fleets. runs-on is the same manifest-resolved route object
    # packed-consumer-smoke pins. No deploy or production secrets: the one
    # secret is the GitHub Packages read token the install already requires.
    name: package / journeys-e2e
    needs: affected
    if: contains(needs.affected.outputs.matrix, '"label":"journeys"')
    runs-on:
      group: playwright-isolated
      labels: [self-hosted, Linux, X64, proxmox-playwright-x64]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null
      PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-ci/browsers
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.33.4
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.3

      - name: Configure GitHub Packages read auth
        run: node ./scripts/package-registry-auth.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the journeys browser e2e
        run: pnpm --filter @narduk-enterprises/journeys run test:e2e

      - name: Remove temporary registry auth
        if: always()
        run: rm -f "${NPM_CONFIG_USERCONFIG}"

  verify:
    # Repo-level roll-up over all three top-level gates. `ci / Required` is the
    # estate-uniform sub-context that covers the 11 package lanes; this job is
    # what covers the two lanes the callable structurally cannot host. It also
    # keeps the historical `verify` check name reporting across the context
    # rename, so nothing that ever authorized on it can be left waiting on a
    # context that stopped existing.
    name: verify
    if: always()
    needs: [affected, ci, contracts, packed-consumer-smoke, journeys-e2e]
    runs-on:
      group: linux-ci
      labels: [self-hosted, Linux, X64, proxmox, linux-ci]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every gate
        env:
          AFFECTED_RESULT: ${{ needs.affected.result }}
          CI_RESULT: ${{ needs.ci.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          PACKED_CONSUMER_EXPECTED: ${{ needs.affected.outputs.packed-consumer }}
          PACKED_CONSUMER_SMOKE_RESULT: ${{ needs.packed-consumer-smoke.result }}
          JOURNEYS_E2E_EXPECTED: ${{ contains(needs.affected.outputs.matrix, '"label":"journeys"') }}
          JOURNEYS_E2E_RESULT: ${{ needs.journeys-e2e.result }}
        run: |
          set -euo pipefail
          status=0
          for gate in AFFECTED CI CONTRACTS; do
            eval "result=\${${gate}_RESULT}"
            if [ "${result}" != "success" ]; then
              echo "::error::${gate} gate reported '${result}'"
              status=1
            fi
          done
          if [ "${PACKED_CONSUMER_EXPECTED}" = "true" ]; then
            if [ "${PACKED_CONSUMER_SMOKE_RESULT}" != "success" ]; then
              echo "::error::PACKED_CONSUMER_SMOKE was required but reported '${PACKED_CONSUMER_SMOKE_RESULT}'"
              status=1
            fi
          elif [ "${PACKED_CONSUMER_SMOKE_RESULT}" != "skipped" ]; then
            echo "::error::PACKED_CONSUMER_SMOKE was not applicable but reported '${PACKED_CONSUMER_SMOKE_RESULT}'"
            status=1
          fi
          if [ "${JOURNEYS_E2E_EXPECTED}" = "true" ]; then
            if [ "${JOURNEYS_E2E_RESULT}" != "success" ]; then
              echo "::error::JOURNEYS_E2E was required but reported '${JOURNEYS_E2E_RESULT}'"
              status=1
            fi
          elif [ "${JOURNEYS_E2E_RESULT}" != "skipped" ]; then
            echo "::error::JOURNEYS_E2E was not applicable but reported '${JOURNEYS_E2E_RESULT}'"
            status=1
          fi
          exit "${status}"
