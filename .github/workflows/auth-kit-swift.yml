name: NardukAuthKit Swift

# NardukAuthKit uses Security and CryptoKit, so it builds only on an Apple
# host. This public repository runs it on a GitHub-hosted macOS image (fleet
# policy: a public repository never takes the fleet Apple runner class);
# the Linux Swift job in logging-languages.yml never sees its targets. Lint (swift-format
# and SwiftLint) needs no Apple SDK, so it runs in the ubuntu-latest `lint` job and the
# macOS job passes --skip-lint, keeping only the steps that need Apple hardware.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: NardukAuthKit lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SWIFTLINT_VERSION: 0.63.3
      SWIFTLINT_SHA256: 26db741d43f2f2dc26c0cf16911100a3e186c3d1dbb59e55ad3ac87b0de4538f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14.7"
      - name: Provision and verify Swift
        run: python scripts/install-swift-linux.py
      - name: Install the pinned SwiftLint release
        run: |
          set -euo pipefail
          directory="${RUNNER_TEMP}/swiftlint"
          mkdir -p "${directory}"
          curl --fail --silent --show-error --location --output "${directory}/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  ${directory}/swiftlint.zip" | sha256sum -c -
          unzip -q "${directory}/swiftlint.zip" swiftlint-static -d "${directory}"
          mv "${directory}/swiftlint-static" "${directory}/swiftlint"
          "${directory}/swiftlint" version
          echo "${directory}" >> "${GITHUB_PATH}"
      - name: Lint NardukAuthKit (swift-format and SwiftLint)
        env:
          CI: "true"
        run: python packages/modules/narduk-auth/swift/scripts/swift-quality.py --lint-only
      - name: Remove the job-local Swift fallback
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "narduk-logging-swift"
          if root.exists():
              shutil.rmtree(root)
          PY

  swift-macos:
    name: NardukAuthKit macOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Xcode 26.6 / Swift 6.3.3 is narduk-logging's declared toolchain. The last
      # step repeats the consumer on Xcode 26.0.1, the version the fleet Apple
      # runners carry, which the hosted image also ships.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the declared Xcode toolchains on this runner image
        run: |
          set -euo pipefail
          missing=0
          for xcode in Xcode_26.6 Xcode_26.0.1; do
            if [ ! -d "/Applications/${xcode}.app/Contents/Developer" ]; then
              echo "::error::/Applications/${xcode}.app is not on this runner image (${ImageOS:-unknown}); update the Xcode pins in auth-kit-swift.yml to a version the image carries."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
      - name: Check NardukAuthKit, its iOS build and a version-tag consumer
        run: python3 packages/modules/narduk-auth/swift/scripts/swift-quality.py --skip-lint
      - name: Resolve and build the consumer with Xcode 26.0.1 (Swift 6.2)
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
        run: python3 packages/modules/narduk-auth/swift/scripts/swift-quality.py --consumer-only
