name: NardukAuthKit Swift

# NardukAuthKit uses Security and CryptoKit, so it builds only on an Apple
# host. This public repository runs it on a GitHub-hosted macOS image; the
# Linux Swift job in logging-languages.yml never sees its targets.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  swift-macos:
    name: NardukAuthKit macOS
    runs-on: macos-26
    timeout-minutes: 30
    env:
      # Swift 6.3 or newer is required by the root manifest's tools version.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      SWIFTLINT_VERSION: 0.63.3
      SWIFTLINT_SHA256: fb045e85e7cb3374f42a4840b6b85a0106302afa69035c0c6f29af4a44c810b6
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install the pinned SwiftLint release
        run: |
          set -euo pipefail
          directory="${RUNNER_TEMP}/swiftlint"
          mkdir -p "${directory}"
          curl --fail --silent --show-error --location --output "${directory}/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  ${directory}/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "${directory}/swiftlint.zip" -d "${directory}"
          "${directory}/swiftlint" version
          echo "${directory}" >> "${GITHUB_PATH}"
      - name: Check NardukAuthKit, its iOS build and a version-tag consumer
        env:
          CI: "true"
        run: python3 packages/modules/narduk-auth/swift/scripts/swift-quality.py
