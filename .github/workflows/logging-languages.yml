name: Logging languages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    name: Python artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.12.7
          enable-cache: false
      - name: Check Python contract, adapters, wheel and source installs
        working-directory: packages/modules/narduk-logging/python
        run: uv run --locked --all-extras python scripts/quality.py
      - name: Check Go format, vet, tests and an isolated consumer
        run: python3 packages/modules/narduk-logging/scripts/go-quality.py

  swift-linux:
    name: Swift Linux artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SWIFTLINT_VERSION: 0.63.3
      SWIFTLINT_SHA256: 26db741d43f2f2dc26c0cf16911100a3e186c3d1dbb59e55ad3ac87b0de4538f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Provision and verify Swift 6.3.3
        run: python scripts/install-swift-linux.py
      - name: Install the pinned SwiftLint release
        run: |
          set -euo pipefail
          directory="${RUNNER_TEMP}/swiftlint"
          mkdir -p "${directory}"
          curl --fail --silent --show-error --location --output "${directory}/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/swiftlint_linux_amd64.zip"
          echo "${SWIFTLINT_SHA256}  ${directory}/swiftlint.zip" | sha256sum -c -
          unzip -q "${directory}/swiftlint.zip" swiftlint-static -d "${directory}"
          mv "${directory}/swiftlint-static" "${directory}/swiftlint"
          "${directory}/swiftlint" version
          echo "${directory}" >> "${GITHUB_PATH}"
      - name: Check Swift contract, Linux adapters and version-tag consumer
        run: python packages/modules/narduk-logging/scripts/swift-quality.py
      - name: Remove the job-local Swift fallback
        if: always()
        run: |
          python - <<'PY'
          import os, shutil
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "narduk-logging-swift"
          if root.exists():
              shutil.rmtree(root)
          PY
