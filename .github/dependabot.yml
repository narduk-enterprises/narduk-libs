version: 2
updates:
  # Keeps the narduk-enterprises/workflows pins (`# v2` comments) and other
  # action SHAs current. Weekly, grouped, one slot per repo (hash of the
  # repo name: Monday 04:00 UTC) so repos do not all open PRs at once.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    ignore:
      # changesets/action v2 requires Changesets CLI v3; this repo is on CLI v2.
      # A grouped bump to v2.1.2 (#1744) broke the release workflow. Lift this
      # with the CLI v3 migration.
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns:
          - "*"
