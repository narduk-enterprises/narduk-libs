<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kit-Header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>body{margin:0} .canvas-root *{transition:none!important;animation:none!important} .dc-piece{position:relative;overflow:hidden} .dc-piece-mounted{display:contents} .sc-host .sc-host:not([style]){display:contents} .dc-app,.dc-piece{--ne-ground:#f4f6f7;--ne-surface:#ffffff;--ne-surface-muted:#f4f6f7;--ne-surface-elevated:#eef1f3;--ne-surface-accented:#e3e8eb;--ne-surface-inverted:#0e1418;--ne-ink:#0e1418;--ne-ink-body:#18212a;--ne-ink-secondary:#3c4a54;--ne-ink-muted:#5a6570;--ne-ink-dimmed:#8b949d;--ne-ink-inverted:#ffffff;--ne-hairline:#dde3e7;--ne-divider:#eaeef1;--ne-line-strong:#c9d1d7;--ne-line-inverted:#0e1418;--ne-hatch:repeating-linear-gradient(135deg, var(--ne-ink-dimmed) 0 1px, transparent 1px 6px);--ne-hatch-soft:repeating-linear-gradient( 135deg, var(--ne-line-strong) 0 1px, transparent 1px 6px );--ne-accent:#2f6b8f;--ne-accent-soft:#e6eef3;--ne-accent-ink:#ffffff;--ne-structure:#18212a;--ne-structure-ink:#ffffff;--ne-radius-base:0.375rem;--ne-radius-control:calc(var(--ne-radius-base) * 1.5);--ne-radius-panel:calc(var(--ne-radius-base) * 2);--ne-radius-tag:9999px;--ne-shadow-1:0 1px 2px rgb(14 20 24 / 0.06), 0 0 0 1px rgb(14 20 24 / 0.04);--ne-shadow-2:0 2px 6px rgb(14 20 24 / 0.08), 0 18px 36px -20px rgb(14 20 24 / 0.28);--ne-shadow-control:inset 0 1px 2px rgb(14 20 24 / 0.08);--ne-font-sans:'Instrument Sans', 'Helvetica Neue', Arial, sans-serif;--ne-font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;--ne-text-display:38px;--ne-text-title:28px;--ne-text-heading:22px;--ne-text-body:15px;--ne-text-small:13px;--ne-text-label:11px;--ne-leading-tight:1.1;--ne-leading-body:1.55;--ne-tracking-tight:-0.03em;--ne-tracking-label:0.12em;--ne-container:1320px;--ne-header-height:4rem} .dc-app,.dc-piece{font-family:var(--ne-font-sans);color:var(--ne-ink);background:var(--ne-ground);-webkit-font-smoothing:antialiased} .kh{display:flex;align-items:center;gap:24px;height:64px;padding:0 24px;background:var(--ne-surface);border-bottom:1px solid var(--ne-hairline);box-sizing:border-box} .kh-brand{font-weight:700;font-size:16px} .kh-nav{display:flex;gap:4px} .kh-tab,.kt-tab{font:inherit;font-weight:600;border:0;background:transparent;color:var(--ne-ink-muted);cursor:pointer} .kh-tab{font-size:14px;padding:8px 12px;border-radius:var(--ne-radius-control)} .kh-tab[aria-current="page"]{color:var(--ne-accent);background:var(--ne-accent-soft)} .kt{display:flex;height:83px;padding-bottom:20px;background:var(--ne-surface);border-top:1px solid var(--ne-hairline);box-sizing:border-box} .kt-tab{flex:1;font-size:12px;padding:10px 4px} .kt-tab[aria-current="page"]{color:var(--ne-accent)} .kh-tab:focus-visible,.kt-tab:focus-visible{outline:2px solid var(--ne-accent);outline-offset:2px} .kb-bar{display:flex;align-items:center;gap:10px;height:56px;padding:0 8px 0 16px;background:var(--ne-surface);border-bottom:1px solid var(--ne-hairline);box-sizing:border-box} .kb-logo{display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:var(--ne-radius-control);background:var(--ne-accent);color:var(--ne-surface);font-size:14px;font-weight:700} .kb-brand{flex:1;font-weight:700;font-size:16px} .kb-burger{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:44px;height:44px;border:0;background:transparent;cursor:pointer;border-radius:var(--ne-radius-control)} .kb-burger i{display:block;width:20px;height:2px;border-radius:1px;background:var(--ne-ink)} .kb-sheet{position:absolute;left:0;right:0;top:56px;height:788px;display:flex;flex-direction:column;gap:16px;padding:16px;background:var(--ne-surface);box-sizing:border-box;overflow-y:auto} .kb-search{font:inherit;font-size:16px;height:44px;padding:0 12px;border:1px solid var(--ne-line-strong);border-radius:var(--ne-radius-control);background:var(--ne-ground);color:var(--ne-ink);box-sizing:border-box} .kb-nav{display:flex;flex-direction:column} .kb-link{font:inherit;font-size:17px;font-weight:600;text-align:left;min-height:48px;padding:0 4px;border:0;border-bottom:1px solid var(--ne-hairline);background:transparent;color:var(--ne-ink);cursor:pointer} .kb-link[aria-current="page"]{color:var(--ne-accent)} .kb-cta{font:inherit;font-size:16px;font-weight:700;min-height:48px;border:0;border-radius:var(--ne-radius-control);background:var(--ne-accent);color:var(--ne-surface);cursor:pointer} .kb-burger:focus-visible,.kb-link:focus-visible,.kb-cta:focus-visible,.kb-search:focus-visible{outline:2px solid var(--ne-accent);outline-offset:2px} .scr{padding:32px;box-sizing:border-box} .scr h1{margin:0 0 16px;font-size:28px} .scr-todo{display:flex;align-items:center;justify-content:center;height:240px;border:1px dashed var(--ne-line-strong);border-radius:var(--ne-radius-control);color:var(--ne-ink-muted);font-size:14px} </style>
</helmet>
<div class="{{pieceClass}}" style="width: 1440px; height: 64px;"><header class="kh"><strong class="kh-brand">{{title}}</strong><nav class="kh-nav" aria-label="Screens"><sc-for list="{{items}}" as="i" hint-placeholder-count="4"><button type="button" class="kh-tab" aria-current="{{i.cur}}" onClick="{{i.pick}}">{{i.label}}</button></sc-for></nav></header></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 1440, "height": 64}, "embed": {"editor": null}, "onPick": {"editor": null}, "current": {"editor": "enum", "options": ["aquidneck-map", "aquidneck-overview", "marc-counties", "looks", "pieces"], "default": "aquidneck-map"}}'>
function pieceClass(p, extra) {
  return (p.embed ? 'dc-piece-mounted' : 'dc-piece') + (extra ? ' ' + extra : '');
}
const ITEMS = [["aquidneck-map", "Island map (GL)"], ["aquidneck-overview", "Island overview (SVG)"], ["marc-counties", "KC counties (SVG)"], ["looks", "Looks"], ["pieces", "Pieces"]];
class Component extends DCLogic {
  renderVals() {
    const p = this.props, s = this.state || {};
    const cur = p.onPick ? (p.current || ITEMS[0][0]) : (s.cur || ITEMS[0][0]);
    const pick = (id) => { if (p.onPick) p.onPick(id); else this.setState({ cur: id }); };
    return { pieceClass: pieceClass(p), title: "narduk-maps", items: ITEMS.map(([id, label]) =>
      ({ id, label, cur: id === cur ? 'page' : 'false', pick: () => pick(id) })) };
  }
}
</script>
</body>
</html>
