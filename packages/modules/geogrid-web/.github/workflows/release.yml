name: Release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: geogrid-web-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on:
      group: linux-deploy
      labels: [self-hosted, Linux, X64, proxmox, proxmox-deploy]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@narduk-enterprises'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release candidate
        run: pnpm run quality

      - name: Verify release ref and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          else
            test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
            test "${GITHUB_REF}" = "refs/heads/main"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Check registry state
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          registry="https://npm.pkg.github.com"
          package_name="$(node -p "require('./package.json').name")"
          version="${{ steps.release.outputs.version }}"
          lookup_log="$(mktemp)"

          if lookup_json="$(npm view "${package_name}@${version}" version --json --registry="${registry}" 2>"${lookup_log}")"; then
            published_version="$(
              node -e 'process.stdout.write(JSON.parse(process.argv[1]))' "${lookup_json}"
            )"
            test "${published_version}" = "${version}"
            echo "published=true" >> "${GITHUB_OUTPUT}"
            echo "::notice::${package_name}@${version} already exists; the publish step will be skipped."
            echo "- Publish: skipped (${package_name}@${version} already exists)" >> "${GITHUB_STEP_SUMMARY}"
          else
            lookup_status=$?
            error_code="$(
              node -e 'process.stdout.write(JSON.parse(process.argv[1]).error?.code ?? "")' "${lookup_json}"
            )"
            if [[ "${error_code}" != "E404" ]]; then
              cat "${lookup_log}" >&2
              echo "::error::Registry lookup failed with ${error_code:-an unknown error}; refusing to treat it as a missing package."
              exit "${lookup_status}"
            fi

            echo "published=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::${package_name}@${version} is absent; publish is required."
            echo "- Publish: required (${package_name}@${version} is absent)" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Publish to GitHub Packages
        if: steps.registry.outputs.published == 'false'
        shell: bash
        run: |
          set -euo pipefail
          pnpm publish --access public --no-git-checks

      - name: Verify published package
        shell: bash
        run: |
          set -euo pipefail
          registry="https://npm.pkg.github.com"
          package_name="$(node -p "require('./package.json').name")"
          expected_version="${{ steps.release.outputs.version }}"
          published_version="$(
            npm view "${package_name}@${expected_version}" version --registry="${registry}"
          )"
          test "${published_version}" = "${expected_version}"
          echo "::notice::Verified ${package_name}@${published_version} in GitHub Packages."
          echo "- Registry readback: ${package_name}@${published_version}" >> "${GITHUB_STEP_SUMMARY}"
