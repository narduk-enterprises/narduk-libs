name: Release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: geogrid-web-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on:
      group: linux-deploy
      labels: [self-hosted, Linux, X64, proxmox, proxmox-deploy]
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@narduk-enterprises'

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release candidate
        run: pnpm run quality

      - name: Verify release ref and package version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME}" = "v${version}"
          else
            test "${GITHUB_EVENT_NAME}" = "workflow_dispatch"
            test "${GITHUB_REF}" = "refs/heads/main"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Publish to GitHub Packages if missing
        shell: bash
        run: |
          set -euo pipefail
          registry="https://npm.pkg.github.com"
          package_name="$(node -p "require('./package.json').name")"
          version="${{ steps.release.outputs.version }}"

          if published_version="$(npm view "${package_name}@${version}" version --registry="${registry}" 2>/dev/null)"; then
            test "${published_version}" = "${version}"
            echo "::notice::${package_name}@${version} is already published; skipping publish."
            exit 0
          fi

          pnpm publish --access public --no-git-checks
