# Calls the shared node-library CI gate instead of carrying a local copy of
# the checkout/setup-node/corepack/install/run-quality shape (company-hq#278:
# every app of a class uses that class's callable from
# narduk-enterprises/workflows). Pinned to @v1 like every other consumer;
# never @main.
#
# The calling job id MUST stay `ci`. GitHub composes a called workflow's check
# context as `<caller job id> / <called job name>`, and the reusable workflow's
# last job is named exactly `Required`, so this produces `ci / Required` --
# the one string every adopting repo reports and branch protection can require
# estate-wide. Renaming this job renames the context and silently orphans any
# rule requiring it.
#
# WHY extra-scripts AND NOT the callable's four standard lanes. GeoGridWeb's
# gate is a single aggregate script:
#
#   "quality": "pnpm run typecheck && pnpm run test && pnpm run build
#               && pnpm run check:package && pnpm exec publint"
#
# The callable's built-in lint/typecheck/test/build lanes would reproduce
# three of those five and quietly drop the other two -- `check:package` is not
# one of the four names it knows, and `publint` is not a package script at
# all, so nothing would run it. Adoption is not supposed to cost gate
# coverage. Running the repo's own aggregate through `extra-scripts` preserves
# the gate verbatim, and the callable still supplies what it is actually here
# for: the `ci / Required` context, manifest runner routing, package-registry
# auth, and one place to fix all of it.
#
# RUNNER ROUTE (manifest-first, never hand-copied). narduk-enterprises is an
# ORG, so `runner` carries the route's `runsOn` object verbatim -- group AND
# labels. Resolved with:
#   python3 scripts/github_runner_fleet.py route \
#     --repository narduk-enterprises/GeoGridWeb --visibility private
#   => {"action": "use-organization-group", "group": "linux-ci",
#       "labels": ["self-hosted","Linux","X64","proxmox","linux-ci"]}
# The previous local job used a labels-only `[self-hosted, linux-ci]`, which is
# the unpinned-debt form docs/CI-RUNNER-POLICY.md 4 calls out: bare
# self-hosted labels also match the credentialed deploy class. This adoption
# pins the group.
#
# release.yml is unchanged and stays local. Publish/release is deliberately
# outside the node-library callable -- credentials and versioning strategy
# differ too much across publishers to share.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Set concurrency in the CALLER: workflow-level concurrency does not propagate
# from a called reusable workflow, and the workflows repo declares none.
#
# cancel-in-progress IS SCOPED TO `pull_request` ON PURPOSE. Superseded PR runs
# should die -- pushing a fixup must not leave the previous commit's run holding
# one of the six linux-ci slots. A run on the DEFAULT BRANCH must NOT be
# cancelled: cancelling it leaves main with no completed CI run, and a cancelled
# run reads exactly like a completed one in `gh run list` unless you look at the
# conclusion, so nothing looks wrong. narduk-mapkit sat red on main for three
# days behind precisely that (company-hq#278, wave-2 finding: its main run was
# cancelled by concurrency at 35s, and the pre-existing failure was only found
# when an unrelated PR inherited the blame). Main runs now queue instead.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    uses: narduk-enterprises/workflows/.github/workflows/node-library.yml@v1
    # A called workflow cannot request MORE than the caller grants, and
    # node-library.yml's package job asks for `packages: read` so it can hit
    # the GitHub Packages registry. Without this the run does not fail a step —
    # it fails to START (`startup_failure`, no logs, no annotation), which is
    # an unusually opaque way to learn about a permissions cap. Same job-level
    # grant narduk-charts' caller carries.
    permissions:
      contents: read
      packages: read
    with:
      runner: '{"group":"linux-ci","labels":["self-hosted","Linux","X64","proxmox","linux-ci"]}'
      node-version: "22"
      package-manager: pnpm
      # See the note above: the aggregate `quality` script IS the gate, so the
      # standard lanes are off rather than duplicating three fifths of it.
      run-lint: false
      run-typecheck: false
      run-tests: false
      run-build: false
      extra-scripts: quality
