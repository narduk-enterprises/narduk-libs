name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://code.platform.nard.uk/api/packages/narduk-enterprises/npm/'
          scope: '@narduk-enterprises'

      - name: Install
        run: npm ci --legacy-peer-deps
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Size
        run: npm run size

      - name: Publish to Forgejo Packages
        run: npm publish --access restricted
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
