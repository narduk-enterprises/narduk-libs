name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      NARDUK_PLATFORM_GH_PACKAGES_READ: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_READ || secrets.NARDUK_PLATFORM_GH_PACKAGES_RW }}
      NARDUK_PLATFORM_GH_PACKAGES_WRITE: ${{ secrets.NARDUK_PLATFORM_GH_PACKAGES_WRITE || secrets.NARDUK_PLATFORM_GH_PACKAGES_RW }}
      NPM_CONFIG_USERCONFIG: ${{ github.workspace }}/.npmrc.auth
      NPM_CONFIG_GLOBALCONFIG: /dev/null

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Configure package registry auth
        run: node ./tools/configure-package-registry-auth.mjs

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Verify
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run size

      - name: Rewrite .npmrc.auth with WRITE token for publish
        env:
          PACKAGE_REGISTRY_PREFER_WRITE: '1'
        run: node ./tools/configure-package-registry-auth.mjs

      - name: Publish to GitHub Packages
        run: npm publish --access public --registry https://npm.pkg.github.com
