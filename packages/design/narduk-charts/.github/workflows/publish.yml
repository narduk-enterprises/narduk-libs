name: Publish package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.FORGEJO_TOKEN }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://code.platform.nard.uk/api/packages/narduk-enterprises/npm/'
          scope: '@narduk-enterprises'

      - name: Verify
        run: |
          npm ci --legacy-peer-deps
          npm run typecheck
          npm test
          npm run build
          npm run size

      - name: Publish to Forgejo Packages
        run: npm publish --access restricted
